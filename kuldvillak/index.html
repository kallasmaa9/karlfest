<style>
/* Telestuudio: tume lava prožektoriga, sügavsinised reljeefsed ruudud, kuldsed numbrid */
:root{
  --stage:#03072b; --stage-glow:#14228a;
  --tile-top:#2338c4; --tile-bot:#0c1677; --tile-edge:#3a54e8; --tile-shade:#060c4a;
  --grout:#000000;
  --gold:#f2b33d; --gold-hi:#ffe08a; --gold-lo:#b97813;
  --ink:#ffffff; --muted:rgba(255,255,255,.78);
  --plus:#3ccf63; --minus:#ff4b55;
  --f-num:"Anton","Oswald",Impact,"Arial Narrow",sans-serif;
  --f-cat:"Oswald","Arial Narrow",Arial,sans-serif;
  --f-clue:"Libre Baskerville",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(ellipse 80% 60% at 50% 0%,var(--stage-glow) 0%,var(--stage) 70%) var(--stage);color:var(--ink);font-family:var(--f-cat);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
button{font-family:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}

#main{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:10px max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}

/* Laud */
#board{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:minmax(56px,.95fr) repeat(5,minmax(0,1fr));gap:6px;background:var(--grout);border:6px solid var(--grout);border-radius:4px;box-shadow:0 0 0 2px #1d2c9a,0 20px 60px rgba(0,0,0,.6)}
.tile{position:relative;border:0;margin:0;padding:0;background:linear-gradient(180deg,var(--tile-top) 0%,var(--tile-bot) 100%);box-shadow:inset 0 3px 0 var(--tile-edge),inset 3px 0 0 rgba(90,120,255,.35),inset 0 -5px 0 var(--tile-shade),inset -3px 0 0 rgba(0,0,40,.5);min-height:40px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cat{color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;font-size:clamp(12px,1.8vw,30px);text-align:center;padding:4px 8px;text-shadow:2px 2px 0 #000;overflow-wrap:anywhere}
.cell{cursor:pointer;transition:filter .15s}
.cell .val{font-family:var(--f-num);font-size:clamp(22px,4.6vw,78px);line-height:1;letter-spacing:.01em;background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(3px 3px 0 #000)}
.cell:hover:not(:disabled),.cell:focus-visible{filter:brightness(1.25)}
.cell:hover:not(:disabled) .val{transform:scale(1.06)}
.cell .val{transition:transform .15s}
.cell:disabled{cursor:default}
.cell:disabled .val{visibility:hidden}

/* sisse-animatsioonid */
@keyframes catIn{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes tileIn{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:none}}
.intro .cat{animation:catIn .55s cubic-bezier(.2,.8,.2,1) both}
.intro .cell{animation:tileIn .35s ease-out both}

/* Küsimuse ekraan */
#question{position:absolute;inset:10px max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;background:linear-gradient(180deg,#1a2cb0 0%,#0a1466 100%);box-shadow:inset 0 4px 0 var(--tile-edge),inset 0 -6px 0 var(--tile-shade),0 0 0 6px var(--grout);border-radius:2px;transform-origin:0 0;z-index:5}
.bar{flex:0 0 auto;background:rgba(0,0,20,.55);border-bottom:2px solid var(--gold-lo);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:8px;padding:4px 16px}
.bar>*{display:flex;justify-content:center;text-align:center}
.barbtn{background:transparent;border:0;color:var(--ink);font-size:14px;display:flex;align-items:center;gap:8px;cursor:pointer;min-height:44px;padding:0 8px;letter-spacing:.03em;text-transform:uppercase}
.barbtn:hover{color:var(--gold-hi)}
.key{background:var(--gold);color:#120c00;border-radius:3px;padding:3px 7px;font-size:11px;font-weight:700}
.qtitle{font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em;line-height:1.25}
.qtitle b{font-family:var(--f-num);font-weight:400;color:var(--gold);font-size:20px;letter-spacing:.02em}
.stage{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 18px;text-align:center;cursor:pointer}
.stage>:first-child{margin-top:auto}.stage>:last-child{margin-bottom:auto}
.txt{font-family:var(--f-clue);font-weight:700;font-size:clamp(20px,3.3vw,56px);line-height:1.32;max-width:1400px;white-space:pre-line;overflow-wrap:anywhere;text-shadow:3px 3px 0 #000}
.ans{color:var(--gold-hi)}
.note{background:var(--gold);color:#120c00;font-weight:700;font-size:clamp(14px,1.5vw,22px);padding:8px 18px;border-radius:3px;max-width:1200px;letter-spacing:.02em}
.media{max-width:min(80%,1200px);max-height:42vh;object-fit:contain;border-radius:4px;cursor:auto;box-shadow:0 0 0 4px #000,0 0 0 6px var(--gold-lo),0 12px 30px rgba(0,0,0,.5)}
video.media{background:#000}
.tools{flex-direction:column;align-items:stretch;gap:4px;max-width:calc(50vw - 330px)}
.tools .tool{min-height:32px;padding:5px 10px;text-align:left}
.tools .step{display:none}
.sub{display:block;font-size:.62em;font-style:italic;opacity:.85;margin-top:.35em;text-shadow:none}
.cat .sub{font-size:.6em;font-weight:500;color:var(--gold-hi);font-style:normal;letter-spacing:.04em;margin-top:.15em}
.note .sub{font-style:normal;font-weight:500}
.lang-both .txt{font-size:clamp(18px,2.8vw,46px)}
.rule{width:min(100%,1200px);height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);flex:0 0 auto}
.qlink{display:inline-flex;align-items:center;min-height:48px;padding:10px 22px;background:var(--gold);color:#120c00;border-radius:4px;font-weight:700;font-size:clamp(16px,1.6vw,24px);text-decoration:none;text-transform:uppercase;letter-spacing:.03em}
.qlink:hover{background:var(--gold-hi)}
@keyframes rise{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
@keyframes ruleIn{0%{transform:scaleX(0)}100%{transform:none}}
.stage .in{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.stage .rule.in{animation:ruleIn .5s ease-out both}

/* Tiimid: kuldse äärega poodiumid */
#teams{flex:0 0 auto;position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:16px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.team{background:linear-gradient(180deg,#14208f,#070d52);border:2px solid var(--gold);border-radius:6px;padding:6px 10px 4px;width:150px;display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15)}
.team input{border:0;border-bottom:1px solid rgba(242,179,61,.6);background:transparent;font:700 14px var(--f-cat);text-transform:uppercase;letter-spacing:.04em;text-align:center;padding:2px 0 4px;color:var(--ink);width:100%;box-sizing:border-box}
.team input::placeholder{color:var(--muted)}
.score{font-family:var(--f-num);font-size:30px;line-height:1.1;text-align:center;color:var(--gold);text-shadow:2px 2px 0 #000;font-variant-numeric:tabular-nums}
.score.neg{color:var(--minus)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.score.bump{animation:bump .35s ease-out}
.pm{display:flex;justify-content:space-around}
.pm button{border:0;background:transparent;font-size:26px;font-weight:700;line-height:1;width:44px;height:34px;cursor:pointer;border-radius:4px}
.pm button:hover{background:rgba(255,255,255,.12)}
.plus{color:var(--plus)}.minus{color:var(--minus)}
.tools{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;gap:8px;align-items:center}
.tool{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid rgba(242,179,61,.5);border-radius:4px;font-size:12px;padding:8px 10px;cursor:pointer;min-height:36px;letter-spacing:.03em}
.tool:hover{background:rgba(242,179,61,.2)}
.confirm{display:flex;gap:6px;align-items:center;font-size:12px}
.step{font-size:12px;color:var(--muted)}

/* Kaptenid */
.team{width:196px}
.teamtop{display:flex;align-items:center;gap:10px}
.teamtop .info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.cap{position:relative;flex:0 0 auto;width:64px;height:64px}
.face{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 0 2px #000;background:#0a1466}
.face img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .4s}
.tear{position:absolute;width:6px;height:9px;margin-left:-3px;background:radial-gradient(circle at 35% 35%,#ffffff 0 18%,#9fd8ff 30%,#3a9cf0 100%);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;opacity:0;pointer-events:none}
@keyframes tear{0%{opacity:0;transform:translateY(-2px) scale(.4)}15%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(30px) scale(1.15,1.3)}}
.tear.go{animation:tear 1.3s ease-in forwards}
.cap.sad .face img{filter:saturate(.45) brightness(.85) hue-rotate(-10deg)}
@keyframes sadDroop{0%,100%{transform:none}30%{transform:translateY(3px) rotate(-4deg)}70%{transform:translateY(3px) rotate(3deg)}}
.cap.sad .face{animation:sadDroop 1.6s ease-in-out}
@keyframes laugh{0%{transform:none}10%{transform:translateY(-6px) rotate(-8deg) scale(1.08)}20%{transform:translateY(0) rotate(7deg) scale(1.06,.96)}30%{transform:translateY(-5px) rotate(-7deg) scale(1.08)}40%{transform:translateY(0) rotate(6deg) scale(1.06,.96)}50%{transform:translateY(-4px) rotate(-5deg)}60%{transform:translateY(0) rotate(4deg)}75%{transform:translateY(-2px) rotate(-2deg)}100%{transform:none}}
.cap.happy .face{animation:laugh 1.2s ease-in-out}
.cap.happy .face img{filter:saturate(1.3) brightness(1.08)}
.ha{position:absolute;font-family:var(--f-num);color:var(--gold-hi);font-size:18px;text-shadow:2px 2px 0 #000;pointer-events:none;white-space:nowrap}
@keyframes haUp{0%{opacity:0;transform:translateY(6px) scale(.6)}20%{opacity:1;transform:translateY(-4px) scale(1.1)}100%{opacity:0;transform:translateY(-34px) scale(1)}}
.ha{animation:haUp 1.3s ease-out forwards}
@media (max-width:900px){.team{width:150px}.cap{width:46px;height:46px}}
@media (prefers-reduced-motion:reduce){.cap.happy .face,.cap.sad .face,.tear.go,.ha{animation:none}.tear,.ha{display:none}}
@media (max-width:900px){
  .tools{position:static;width:100%;justify-content:center;order:2;flex-direction:row;max-width:none;flex-wrap:wrap}
  .team{width:112px}.score{font-size:24px}
  .barbtn{font-size:11px}.key{display:none}
  #board{gap:3px;border-width:3px}
}
@media (prefers-reduced-motion:reduce){
  .intro .cat,.intro .cell,.stage .in,.score.bump{animation:none}
  .cell,.cell .val{transition:none}
}
</style>

<div id="app">
  <div id="main">
    <section id="board" aria-label="Mängulaud"></section>

      </div>
      <div class="stage" id="stage"></div>

  </div>
  <footer id="teams">
    <div class="tools" id="tools"></div>
  </footer>
</div>

    { q: "The exact attendance, final score and Paide's goalscorer in the Paide vs Rapid Vienna European match", a: "5,069 spectators\n1–4 loss\nGoalscorer: Daniel Luts" } ] },
  { name: "Real or fake", qs: [
    { q: RQ_EN, note: NOTE_EN, img: "media/paris-100-platud.jpg", a: "Edited!\n1) Despite the warm summer, Andu was actually wearing stuffy black leather sneakers.\n2) The brake calipers are yellow in the photo but red in real life (a special test made for Andu).\nThe real photo:", aImg: "media/paris-100-paris.jpg" },
    { q: RQ_EN, note: NOTE_EN, img: "media/paris-200-muudetud.jpg", a: "Edited!\nThe cauliflower dish was swapped for salmon nigiri using ChatGPT.\nThe real photo:", aImg: "media/paris-200-originaal.jpg" },
    { q: RQ_EN, note: NOTE_EN, img: "media/paris-300.jpg", a: "It's real!\nThe photo is an unedited original." },
    { q: RQ_EN, note: NOTE_EN, img: "media/paris-400.jpg", a: "It's real!\nRandin and Saara Koppel on a summer stroll in Pärnu.\nThe mother of his future children is a lucky woman…" },
    { q: RQ_EN, note: NOTE_EN, img: "media/paris-500-muudetud.jpg", a: "Edited!\nA splash of Aperol has been added to Papa Madis's glass.\nThe real photo:", aImg: "media/paris-500-originaal.jpg" } ] }
];

/* Keel: "et" | "en" | "both" */
const LANGS = ["et", "en", "both"];
let LANG = "et";
try { const l = localStorage.getItem("kuldvillak-lang"); if (LANGS.includes(l)) LANG = l; } catch (e) {}
const T = {
  back: ["Tagasi lauale", "Back to board"], show: ["Näita vastust", "Show answer"], hide: ["Peida vastus", "Hide answer"],
  space: ["Tühik", "Space"], restart: ["Alusta uuesti", "Start over"], fs: ["Täisekraan", "Fullscreen"], exitfs: ["Välju täisekraanist", "Exit fullscreen"],
  ask: ["Nullida punktid ja laud?", "Reset scores and board?"], yes: ["Jah, nulli", "Yes, reset"], cancel: ["Tühista", "Cancel"],
  link: ["Ava link", "Open link"], board: ["Mängulaud", "Game board"]
};
const tr = (k) => LANG === "et" ? T[k][0] : LANG === "en" ? T[k][1] : T[k][0] + " / " + T[k][1];
/* kakskeelne tekstiplokk: põhitekst + inglise keel väiksemalt all */
function bi(tag, cls, et, en) {
  const n = document.createElement(tag); n.className = cls;
  if (LANG === "en") n.textContent = en != null ? en : et;
  else { n.textContent = et; if (LANG === "both" && en != null && en !== et) { const s = document.createElement("span"); s.className = "sub"; s.textContent = en; n.append(s); } }
  return n;
}
function setLang(l) {
  LANG = l; try { localStorage.setItem("kuldvillak-lang", l); } catch (e) {}
  document.body.classList.toggle("lang-both", l === "both");
  document.documentElement.lang = l === "en" ? "en" : "et";
  staticLabels(); renderBoard(false);
  if (cur) { setTitle(); renderStage(false); }
  renderTeams();
}
function staticLabels() {
  $("back").replaceChildren(tr("back") + " ", Object.assign(document.createElement("span"), { className: "key", textContent: "ESC" }));
  $("spaceKey").textContent = tr("space");
  $("board").setAttribute("aria-label", tr("board"));
  if (!cur) $("revealLabel").textContent = tr("show");
}
function setTitle() {
  const c = cur.ci, en = GAME_EN[c].name, et = GAME[c].name;
  $("qtitle").replaceChildren((LANG === "en" ? en : LANG === "both" && en !== et ? et + " / " + en : et) + " · ", el("b", { textContent: VALUES[cur.r] }));
}
const VALUES = [10, 20, 30, 40, 50];
const STORE = "kuldvillak-state-party";
const REDUCED = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } })();

const fresh = () => ({ used: {}, scores: [0, 0, 0], names: ["Tiim 1", "Tiim 2", "Tiim 3"], step: 10 });
let S = fresh();
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && Array.isArray(s.scores)) S = Object.assign(fresh(), s); } catch (e) {}
if (VALUES.indexOf(S.step) < 0) S.step = VALUES[0];
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} };

let cur = null, curTile = null, revealed = false, confirming = false, busy = false;
const $ = (id) => document.getElementById(id);
const el = (tag, props, kids) => { const n = document.createElement(tag); Object.assign(n, props || {}); (kids || []).forEach(k => n.append(k)); return n; };

function renderBoard(intro) {
  const b = $("board"), kids = [];
  GAME.forEach((c, ci) => {
    const t = el("div", { className: "tile" }, [bi("span", "cat", c.name, GAME_EN[ci].name)]);
    t.firstChild.style.animationDelay = (ci * 160) + "ms";
    kids.push(t);
  });
  // juhuslik järjekord laua "täitumiseks"
  const order = Array.from({ length: 25 }, (_, i) => i).sort(() => Math.random() - .5);
  VALUES.forEach((v, r) => GAME.forEach((c, ci) => {
    const key = ci + "-" + r, used = !!S.used[key];
    const btn = el("button", { className: "tile cell", type: "button", disabled: used }, [el("span", { className: "val", textContent: v })]);
    btn.setAttribute("aria-label", c.name + ", " + v + (used ? " (kasutatud)" : ""));
    btn.dataset.key = key;
    btn.style.animationDelay = (900 + order[r * 5 + ci] * 45) + "ms";
    btn.addEventListener("click", () => openQ(ci, r, btn));
    kids.push(btn);
  }));
  b.classList.toggle("intro", !!intro && !REDUCED);
  b.replaceChildren(...kids);
}

function media(src, isVideo, alt) {
  if (!src) return null;
  const m = isVideo ? el("video", { src, controls: true, playsInline: true, className: "media", preload: "metadata" })
                    : el("img", { src, alt, className: "media" });
  m.addEventListener("click", e => e.stopPropagation());
  return m;
}

function renderStage(animateAnswer) {
  const q = GAME[cur.ci].qs[cur.r], e = GAME_EN[cur.ci].qs[cur.r];
  const qImg = LANG === "en" ? e.img : q.img, aImg = LANG === "en" ? e.aImg : q.aImg;
  const top = [q.note ? bi("div", "note", q.note, e.note) : null, bi("div", "txt", q.q, e.q), media(qImg, false, ""), media(q.video, true)].filter(Boolean);
  let bottom = [];
  if (revealed) {
    bottom = [el("div", { className: "rule" }), bi("div", "txt ans", q.a, e.a), media(aImg, false, ""), media(q.aVideo, true)];
    if (q.link) {
      const a = el("a", { href: q.link, target: "_blank", rel: "noopener", className: "qlink", textContent: (LANG === "en" ? (e.linkText || T.link[1]) : LANG === "both" ? (q.linkText || T.link[0]) + " / " + (e.linkText || T.link[1]) : (q.linkText || T.link[0])) + " ↗" });
      a.addEventListener("click", e => e.stopPropagation());
      bottom.push(a);
    }
    bottom = bottom.filter(Boolean);
    if (animateAnswer) bottom.forEach((n, i) => { n.classList.add("in"); n.style.animationDelay = (i * 110) + "ms"; });
  }
  $("stage").replaceChildren(...top, ...bottom);
  $("revealLabel").textContent = revealed ? tr("hide") : tr("show");
  if (animateAnswer && bottom.length) bottom[0].scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" });
}

function tileTransform(tile) {
  const m = $("question").getBoundingClientRect(), t = tile.getBoundingClientRect();
  return `translate(${t.left - m.left}px, ${t.top - m.top}px) scale(${t.width / m.width}, ${t.height / m.height})`;
}

function openQ(ci, r, tile) {
  if (busy) return;
  cur = { ci, r }; curTile = tile; revealed = false;
  S.used[ci + "-" + r] = true; S.step = VALUES[r]; save();
  setTitle();
  renderStage(false);
  const qs = $("question");
  qs.hidden = false;
  renderTeams();
  tile.disabled = true;
  if (!REDUCED && qs.animate) {
    busy = true;
    const kids = Array.from($("stage").children);
    kids.forEach(k => k.style.opacity = 0);
    const anim = qs.animate([{ transform: tileTransform(tile), opacity: .9 }, { transform: "none", opacity: 1 }], { duration: 520, easing: "cubic-bezier(.2,.8,.2,1)" });
    anim.onfinish = () => {
      busy = false;
      kids.forEach((k, i) => { k.style.opacity = ""; k.classList.add("in"); k.style.animationDelay = (i * 120) + "ms"; });
      $("reveal").focus({ preventScroll: true });
    };
  } else {
    $("reveal").focus({ preventScroll: true });
  }
}

function closeQ() {
  if (busy || !cur) return;
  document.querySelectorAll("#stage video").forEach(v => v.pause());
  const qs = $("question");
  const done = () => {
    busy = false; qs.hidden = true; cur = null;
    if (curTile) { curTile.setAttribute("aria-label", curTile.getAttribute("aria-label") + " (kasutatud)"); curTile.focus({ preventScroll: true }); }
  };
  if (!REDUCED && qs.animate && curTile && curTile.isConnected) {
    busy = true;
    const anim = qs.animate([{ transform: "none", opacity: 1 }, { transform: tileTransform(curTile), opacity: .4 }], { duration: 380, easing: "cubic-bezier(.6,0,.8,.4)" });
    anim.onfinish = done;
  } else done();
}

function toggleReveal() { if (!cur || busy) return; revealed = !revealed; renderStage(revealed); }

/* Tiimikaptenid: pilt + silmade asukoht (protsentides) pisarate jaoks */
const CAPTAINS = [
  { img: "media/kapten-1.jpg", eyes: [[33, 45], [67, 45]] },
  { img: "media/kapten-2.jpg", eyes: [[33, 45], [67, 45]] },
  { img: "media/kapten-3.jpg", eyes: [[33, 45], [67, 45]] }
];
function captain(i) {
  const c = CAPTAINS[i]; if (!c) return null;
  const face = el("div", { className: "face" }, [el("img", { src: c.img, alt: "Tiim " + (i + 1) + " kapten" })]);
  const cap = el("div", { className: "cap" }, [face]);
  let timer = null;
  const reset = () => { cap.classList.remove("happy", "sad"); void cap.offsetWidth; clearTimeout(timer); cap.querySelectorAll(".ha").forEach(n => n.remove()); face.querySelectorAll(".tear").forEach(n => n.remove()); };
  cap.laugh = () => {
    reset(); cap.classList.add("happy");
    if (!REDUCED) [["HA", -10, -6, 0], ["HA!", 40, -12, 180], ["HA", 18, -20, 360]].forEach(([t, x, y, d]) => {
      const h = el("span", { className: "ha", textContent: t }); h.style.left = x + "px"; h.style.top = y + "px"; h.style.animationDelay = d + "ms"; cap.append(h);
    });
    timer = setTimeout(() => cap.classList.remove("happy"), 1500);
  };
  cap.cry = () => {
    reset(); cap.classList.add("sad");
    if (!REDUCED) [0, 450, 900].forEach(d => c.eyes.forEach(([x, y], k) => {
      const t = el("span", { className: "tear" }); t.style.left = x + "%"; t.style.top = (y + 4) + "%"; t.style.animationDelay = (d + k * 120) + "ms"; t.classList.add("go"); face.append(t);
    }));
    timer = setTimeout(() => cap.classList.remove("sad"), 2600);
  };
  return cap;
}

function renderTeams() {
  const wrap = $("teams"), tools = $("tools");
  wrap.querySelectorAll(".team").forEach(n => n.remove());
  S.names.forEach((name, i) => {
    const input = el("input", { type: "text", value: name, id: "team-name-" + i, placeholder: "Tiimi nimi" });
    input.setAttribute("aria-label", "Tiim " + (i + 1) + " nimi");
    input.addEventListener("input", () => { S.names[i] = input.value; save(); });
    const score = el("div", { className: "score" + (S.scores[i] < 0 ? " neg" : ""), textContent: S.scores[i] });
    const upd = () => {
      score.textContent = S.scores[i]; score.classList.toggle("neg", S.scores[i] < 0);
      score.classList.remove("bump"); void score.offsetWidth; score.classList.add("bump"); save();
    };
    const plus = el("button", { type: "button", className: "plus", textContent: "+" });
    const minus = el("button", { type: "button", className: "minus", textContent: "−" });
    plus.setAttribute("aria-label", "Lisa " + S.step + " punkti");
    minus.setAttribute("aria-label", "Võta " + S.step + " punkti maha");
    const cap = captain(i);
    plus.addEventListener("click", () => { S.scores[i] += S.step; upd(); if (cap) cap.laugh(); });
    minus.addEventListener("click", () => { S.scores[i] -= S.step; upd(); if (cap) cap.cry(); });
    const top = el("div", { className: "teamtop" }, [cap, el("div", { className: "info" }, [input, score])].filter(Boolean));
    wrap.insertBefore(el("div", { className: "team" }, [top, el("div", { className: "pm" }, [plus, minus])]), tools);
  });
  renderTools();
}

function renderTools() {
  const t = $("tools"), kids = [];
  if (confirming) {
    const yes = el("button", { type: "button", className: "tool", textContent: tr("yes") });
    const no = el("button", { type: "button", className: "tool", textContent: tr("cancel") });
    yes.addEventListener("click", () => {
      const names = S.names; S = fresh(); S.names = names; save(); confirming = false;
      cur = null; busy = false; $("question").hidden = true; renderBoard(true); renderTeams();
    });
    no.addEventListener("click", () => { confirming = false; renderTools(); });
    kids.push(el("span", { className: "confirm" }, [tr("ask"), yes, no]));
  } else {
    const reset = el("button", { type: "button", className: "tool", textContent: tr("restart") });
    reset.addEventListener("click", () => { confirming = true; renderTools(); });
    kids.push(reset);
    if (document.documentElement.requestFullscreen) {
      const fs = el("button", { type: "button", className: "tool", textContent: document.fullscreenElement ? tr("exitfs") : tr("fs") });
      fs.addEventListener("click", () => {
        const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(() => {});
      });
      kids.push(fs);
    }
    const lb = el("button", { type: "button", className: "tool", textContent: { et: "Keel: ET", en: "Language: EN", both: "ET + EN" }[LANG] });
    lb.setAttribute("aria-label", "Vaheta keelt / Change language");
    lb.addEventListener("click", () => setLang(LANGS[(LANGS.indexOf(LANG) + 1) % LANGS.length]));
    kids.push(lb);
    kids.push(el("span", { className: "step", textContent: "+/− " + S.step }));
  }
  t.replaceChildren(...kids);
}
document.addEventListener("fullscreenchange", renderTools);

$("back").addEventListener("click", closeQ);
$("reveal").addEventListener("click", e => { e.stopPropagation(); toggleReveal(); });
$("stage").addEventListener("click", toggleReveal);
document.addEventListener("keydown", e => {
  if (!cur) return;
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "VIDEO") return;
  if (e.key === "Escape") { e.preventDefault(); closeQ(); }
  else if (e.key === " " || e.code === "Space") { e.preventDefault(); toggleReveal(); }
});

document.body.classList.toggle("lang-both", LANG === "both");
document.documentElement.lang = LANG === "en" ? "en" : "et";
staticLabels();
renderBoard(true);
renderTeams();
</script>

</body>
</html>
