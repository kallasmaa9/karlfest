<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}a.tool{text-decoration:none;display:inline-flex;align-items:center;box-sizing:border-box}</style>
<title>Karli Laululahing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,700;0,800;0,900;1,800&family=Righteous&display=swap">
<style>
/* Lillas valguses kontserdilava: violetsed prožektorikiired, klaasjad lillad paneelid kuldse äärega, metalselt kuldne kiri. Teler = #ekraan, telefon = #kapten */
:root{
  --stage:#14052f; --stage-glow:#7a2be0; --beam:rgba(214,170,255,.10);
  --panel-top:rgba(104,46,196,.78); --panel-bot:rgba(36,9,86,.9); --edge:rgba(255,210,63,.6); --shade:#0d0326;
  --gold:#ffd23f; --gold-hi:#fff4a8; --gold-lo:#c98a00;
  --ink:#ffffff; --muted:rgba(255,255,255,.75);
  --ok:#3ccf63; --bad:#ff4b55; --mid:#ffc93c;
  --f-num:"Montserrat",Arial,sans-serif;
  --f-ui:"Montserrat",Arial,sans-serif;
  --f-logo:"Righteous","Montserrat",Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(ellipse 70% 55% at 50% 8%,rgba(176,92,255,.55) 0%,transparent 60%),radial-gradient(ellipse 40% 40% at 4% 85%,rgba(255,180,255,.35) 0%,transparent 60%),radial-gradient(ellipse 40% 40% at 96% 80%,rgba(255,180,255,.35) 0%,transparent 60%),linear-gradient(180deg,#3a0f8a 0%,var(--stage) 75%) var(--stage);color:var(--ink);font-family:var(--f-ui);letter-spacing:.01em}
/* prožektorikiired */
body::before{content:"";position:fixed;inset:-20% -10% 0;pointer-events:none;z-index:0;background:repeating-conic-gradient(from 180deg at 50% -10%,var(--beam) 0deg 3deg,transparent 3deg 11deg);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 75%);mask-image:linear-gradient(180deg,#000 0%,transparent 75%);animation:sway 14s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
#root{position:relative;z-index:1;height:100%}
button,input,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}
.btn{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));color:#140d00;border:0;border-radius:6px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:16px;padding:12px 20px;min-height:48px;cursor:pointer;box-shadow:0 3px 0 #000}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.ghost{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid rgba(242,179,61,.5);border-radius:5px;font-size:13px;padding:8px 12px;min-height:40px;cursor:pointer;letter-spacing:.04em;text-transform:uppercase}
.ghost:hover{background:rgba(242,179,61,.2)}
.ghost .k{background:var(--gold);color:#140d00;border-radius:3px;padding:1px 6px;font-size:11px;margin-left:6px;font-weight:700}
.panel{background:linear-gradient(180deg,var(--panel-top),var(--panel-bot));box-shadow:inset 0 0 0 2px var(--edge),0 0 34px rgba(155,90,255,.45),0 18px 50px rgba(0,0,0,.55);border-radius:16px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.msg{max-width:560px;margin:12vh auto 0;padding:28px 24px;text-align:center;font-size:18px;line-height:1.5}
.msg h1{font-family:var(--f-logo);font-weight:400;color:var(--gold);font-size:46px;margin:0 0 12px;text-shadow:0 3px 0 var(--gold-lo),0 6px 14px rgba(0,0,0,.5)}

/* ============ TELER ============ */
#tv{height:100%;display:flex;flex-direction:column;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:12px;box-sizing:border-box;overflow:hidden}
.tvhead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--f-logo);font-size:clamp(34px,4.4vw,74px);line-height:1.05;background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 40%,#e9a800 60%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #8a5a00) drop-shadow(0 8px 16px rgba(0,0,0,.55));letter-spacing:.01em;padding:0 .1em}
.roundbox{text-align:right}
.roundlbl{font-family:var(--f-num);font-weight:900;font-size:clamp(20px,2.4vw,40px);line-height:1;letter-spacing:.06em;text-shadow:0 3px 10px rgba(0,0,0,.6)}
.roundlbl b{font-weight:900;color:var(--gold)}
.dots{display:flex;gap:5px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.15);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.dot.done{background:var(--gold);box-shadow:0 0 8px rgba(255,210,63,.7)}
.dot.now{background:var(--ink);box-shadow:0 0 0 3px var(--gold);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.3)}}
.correct{align-self:center;max-width:100%;padding:12px 28px;text-align:center;font-size:clamp(20px,2.4vw,40px);font-weight:700;text-transform:uppercase;letter-spacing:.03em;text-shadow:2px 2px 0 #000}
.correct small{display:block;font-size:.45em;color:var(--gold);letter-spacing:.2em;margin-bottom:4px}
@keyframes drop{0%{opacity:0;transform:translateY(-30px) scale(.9)}100%{opacity:1;transform:none}}
.correct.in{animation:drop .6s cubic-bezier(.2,.8,.2,1) both}
.teams{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,32px);align-items:stretch}
.tcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 14px 16px;min-height:0;overflow:hidden}
.tcard.lead::before{content:"LIIDER";position:absolute;top:12px;right:12px;background:var(--gold);color:#140d00;font-weight:700;font-size:12px;letter-spacing:.15em;padding:3px 8px;border-radius:3px}
.cap{position:relative;flex:0 0 auto;width:clamp(90px,11vw,170px);aspect-ratio:1}
.face{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:4px solid var(--gold);box-shadow:0 0 0 3px #2a0a5e,0 0 30px rgba(255,210,63,.35),0 10px 30px rgba(0,0,0,.5);background:#2a0a5e}
.face img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .4s}
.tear{position:absolute;width:9px;height:13px;margin-left:-4px;background:radial-gradient(circle at 35% 35%,#fff 0 18%,#9fd8ff 30%,#3a9cf0 100%);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;opacity:0;pointer-events:none;animation:tear 1.4s ease-in forwards}
@keyframes tear{0%{opacity:0;transform:translateY(-2px) scale(.4)}15%{opacity:1;transform:none}100%{opacity:0;transform:translateY(60px) scale(1.15,1.3)}}
.cap.sad .face img{filter:saturate(.4) brightness(.85)}
@keyframes sadDroop{0%,100%{transform:none}30%{transform:translateY(4px) rotate(-4deg)}70%{transform:translateY(4px) rotate(3deg)}}
.cap.sad .face{animation:sadDroop 1.8s ease-in-out}
@keyframes laugh{0%{transform:none}10%{transform:translateY(-10px) rotate(-8deg) scale(1.08)}20%{transform:rotate(7deg) scale(1.06,.96)}30%{transform:translateY(-8px) rotate(-7deg) scale(1.08)}40%{transform:rotate(6deg) scale(1.06,.96)}50%{transform:translateY(-6px) rotate(-5deg)}60%{transform:rotate(4deg)}75%{transform:translateY(-3px) rotate(-2deg)}100%{transform:none}}
.cap.happy .face{animation:laugh 1.3s ease-in-out}
.cap.happy .face img{filter:saturate(1.3) brightness(1.08)}
.ha{position:absolute;font-family:var(--f-logo);color:var(--gold-hi);font-size:clamp(18px,2vw,32px);text-shadow:2px 2px 0 #000;pointer-events:none;white-space:nowrap;animation:haUp 1.4s ease-out forwards}
@keyframes haUp{0%{opacity:0;transform:translateY(8px) scale(.6)}20%{opacity:1;transform:translateY(-4px) scale(1.1)}100%{opacity:0;transform:translateY(-50px)}}
.tname{font-weight:700;font-size:clamp(16px,1.7vw,28px);text-transform:uppercase;letter-spacing:.05em;text-align:center;text-shadow:2px 2px 0 #000;overflow-wrap:anywhere}
.total{font-family:var(--f-num);font-weight:900;font-size:clamp(44px,5.6vw,104px);line-height:.95;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #6b3d00);font-variant-numeric:tabular-nums}
.total small{font-family:var(--f-ui);font-size:.2em;color:var(--muted);display:block;text-align:center;letter-spacing:.2em;text-shadow:none}
.status{font-size:clamp(14px,1.3vw,22px);font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.35);color:var(--muted)}
.status.ready{background:var(--ok);color:#03150a;animation:readyPop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes readyPop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:none}}
.status.wait::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.ansbox{width:100%;display:flex;flex-direction:column;gap:6px;perspective:800px}
.arow{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.35);border-radius:5px;padding:8px 12px;font-size:clamp(14px,1.4vw,24px);text-align:left;min-width:0}
.arow .lbl{flex:0 0 auto;font-size:.6em;color:var(--gold);letter-spacing:.15em;width:4.6em}
.arow .val{flex:1 1 auto;min-width:0;font-weight:700;overflow-wrap:anywhere}
.arow .mark{flex:0 0 auto;font-weight:700;font-size:1.1em}
.arow.ok .mark{color:var(--ok)}.arow.no .mark{color:var(--bad)}
.arow.empty .val{color:var(--muted);font-weight:500}
@keyframes flipIn{0%{opacity:0;transform:rotateX(-90deg)}100%{opacity:1;transform:none}}
.ansbox.in .arow{animation:flipIn .55s cubic-bezier(.2,.8,.2,1) both}
.pts{border:0;cursor:pointer;font-family:var(--f-num);font-weight:900;font-size:clamp(40px,4.6vw,84px);line-height:1;padding:6px 22px 10px;border-radius:10px;color:#140d00;background:var(--gold);box-shadow:0 4px 0 #000;min-width:2.4em}
.pts.p0{background:#5b6280;color:#fff}.pts.p1{background:var(--mid)}.pts.p2{background:var(--ok);color:#04170a}
@keyframes ptsIn{0%{opacity:0;transform:scale(.2) rotate(-20deg)}60%{opacity:1;transform:scale(1.2) rotate(4deg)}100%{transform:none}}
.pts.in{animation:ptsIn .6s cubic-bezier(.2,.8,.2,1) both}
.pts:hover{filter:brightness(1.1)}
.manual{display:flex;flex-direction:column;gap:6px;width:100%}
.manual input{background:#fff;color:#111;border:0;border-radius:4px;padding:8px 10px;font-size:15px}
.edit{position:absolute;top:10px;left:10px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(242,179,61,.5);background:rgba(0,0,0,.3);color:var(--ink);cursor:pointer;font-size:16px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.ctrl .ghost{opacity:.6}
.ctrl .ghost:hover,.ctrl .ghost:focus-visible{opacity:1}
.ctrl .main{opacity:1;min-height:52px;font-size:17px;padding:10px 22px;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));color:#140d00;border:0;font-weight:800;box-shadow:0 3px 0 #000;text-decoration:none;display:inline-flex;align-items:center}
.ctrl .main .k{background:rgba(0,0,0,.18);color:#140d00}
.steps3{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.steps3 span{padding:4px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.25)}
.steps3 span.on{background:var(--ink);color:#1a0640;border-color:var(--ink)}
.eq{display:inline-flex;align-items:flex-end;gap:4px;height:1em;vertical-align:-.1em}
.eq i{width:.22em;background:var(--gold);border-radius:2px;height:30%}
.eq.on i{animation:eq .9s ease-in-out infinite}
.eq.on i:nth-child(2){animation-delay:.15s}.eq.on i:nth-child(3){animation-delay:.3s}.eq.on i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.playing{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(13px,1.2vw,20px);color:var(--gold-hi)}
.ctrl:hover,.ctrl:focus-within{opacity:1}
.ghost.play{text-decoration:none;display:inline-flex;align-items:center;background:rgba(60,207,99,.2);border-color:var(--ok)}
.conn{font-size:12px;color:var(--muted);margin-left:8px}

/* Seaded */
.sheet{position:fixed;inset:0;background:rgba(12,2,30,.8);display:flex;align-items:flex-start;justify-content:center;z-index:20;overflow-y:auto;padding:24px 16px}
.sheet .panel{width:min(760px,100%);padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:var(--f-logo);font-weight:400;color:var(--gold);font-size:30px;letter-spacing:.02em}
.sheet label{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.sheet textarea,.sheet input[type=text],.sheet input[type=number]{width:100%;box-sizing:border-box;background:#fff;color:#111;border:0;border-radius:4px;padding:10px;font-size:15px;font-family:var(--f-ui)}
.sheet textarea{min-height:260px;line-height:1.5}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.qr{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.qr #qrbox{background:#fff;padding:10px;border-radius:6px;line-height:0}
.qr code{font-size:14px;word-break:break-all;color:var(--gold-hi)}

/* QR-vaade kaptenitele */
.qrview{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,2.4vh,30px);padding:24px;text-align:center;background:radial-gradient(ellipse 70% 55% at 50% 10%,rgba(176,92,255,.5) 0%,transparent 60%),linear-gradient(180deg,#3a0f8a 0%,var(--stage) 80%)}
.qrview .logo{font-size:clamp(46px,6vw,110px)}
.qrview .lead{font-weight:800;font-size:clamp(20px,2.4vw,40px);letter-spacing:.04em}
.qrview .qrbig{background:#fff;padding:clamp(14px,1.6vw,26px);border-radius:22px;line-height:0;box-shadow:0 0 0 4px var(--gold),0 0 60px rgba(255,210,63,.35)}
.qrview .qrbig img,.qrview .qrbig canvas{width:min(46vh,520px)!important;height:min(46vh,520px)!important;image-rendering:pixelated}
.qrview .steps{display:flex;gap:clamp(14px,3vw,56px);flex-wrap:wrap;justify-content:center;font-size:clamp(15px,1.5vw,24px);font-weight:700}
.qrview .steps b{display:inline-flex;width:1.7em;height:1.7em;border-radius:50%;background:var(--gold);color:#140d00;align-items:center;justify-content:center;margin-right:.45em}
.qrview code{font-size:clamp(13px,1.1vw,18px);color:var(--gold-hi);word-break:break-all;max-width:90vw}
.qrview .close{position:absolute;top:18px;right:18px}
/* Lõpptulemused */
.final{flex:1 1 auto;display:flex;align-items:flex-end;justify-content:center;gap:clamp(14px,3vw,48px);padding-bottom:10px}
.pod{display:flex;flex-direction:column;align-items:center;gap:10px}
.pod .block{width:clamp(120px,16vw,260px);display:flex;align-items:flex-start;justify-content:center;font-family:var(--f-num);font-weight:900;font-size:clamp(40px,5vw,90px);color:var(--gold);text-shadow:4px 4px 0 #000;padding-top:10px}
@keyframes rise{0%{transform:scaleY(0)}100%{transform:none}}
.pod .block{transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.confetti{position:fixed;top:-20px;width:10px;height:16px;pointer-events:none;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* telefon: mis praegu toimub */
.now{display:flex;align-items:center;gap:16px;padding:16px 18px}
.now .eq{font-size:44px;flex:0 0 auto}
.now .nowt{font-weight:900;font-size:22px;line-height:1.15}
.now .nows{color:var(--muted);font-size:15px;margin-top:3px}
.now.on{box-shadow:inset 0 0 0 2px var(--gold),0 0 30px rgba(255,210,63,.35)}
.done{padding:20px 18px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.done .ok{font-weight:900;font-size:24px;color:var(--ok)}
.done .mine{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.done .hint2{color:var(--muted);font-size:14px}
/* ============ TELEFON ============ */
#phone{max-width:520px;margin:0 auto;min-height:100%;box-sizing:border-box;padding:18px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.ph-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ph-head .logo{font-size:30px}
.ph-round{font-family:var(--f-num);font-weight:900;font-size:24px;letter-spacing:.05em}
.ph-round b{color:var(--gold)}
.pick{display:flex;flex-direction:column;gap:12px}
.pickbtn{display:flex;align-items:center;gap:14px;padding:12px 14px;border:0;cursor:pointer;color:var(--ink);text-align:left;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;min-height:84px}
.pickbtn img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);flex:0 0 auto}
.me{display:flex;align-items:center;gap:12px}
.me img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}
.me .n{font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:18px}
.me .s{color:var(--gold);font-family:var(--f-num);font-weight:900;font-size:20px}
.form{padding:18px;display:flex;flex-direction:column;gap:12px}
.form label{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.form input{width:100%;box-sizing:border-box;background:#fff;color:#111;border:0;border-radius:6px;padding:14px 12px;font-size:20px;font-family:var(--f-ui)}
.sent{background:rgba(60,207,99,.15);border:1px solid var(--ok);border-radius:6px;padding:10px 12px;font-size:15px;line-height:1.4}
.err{background:rgba(255,75,85,.15);border:1px solid var(--bad);border-radius:6px;padding:10px 12px;font-size:15px;line-height:1.4}
.result{padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.result .big{font-family:var(--f-num);font-weight:900;font-size:84px;line-height:1;text-shadow:4px 4px 0 #000}
.result .big.p0{color:#aab}.result .big.p1{color:var(--mid)}.result .big.p2{color:var(--ok)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;cursor:pointer;padding:10px;min-height:44px}

@media (max-width:900px){
  .teams{grid-template-columns:1fr;flex:0 0 auto;align-content:start;overflow:visible}
  .tcard{overflow:visible;min-height:auto}
  .tcard{display:grid;grid-template-columns:clamp(90px,22vw,130px) minmax(0,1fr);column-gap:16px;row-gap:8px;align-items:center;justify-items:start;text-align:left}
  .tcard .cap{grid-row:span 2;width:100%}
  .tcard .tname{text-align:left}
  .tcard .total small{text-align:left}
  .tcard .ansbox,.tcard .manual,.tcard .status,.tcard .pts{grid-column:1 / -1;justify-self:stretch}
  .tcard .status{text-align:center}
  .tcard .edit{left:auto;right:10px}
  #tv{overflow-y:auto}
}
@media (prefers-reduced-motion:reduce){
  body::before{animation:none}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .tear,.ha,.confetti{display:none}
}
</style>

<script>
/* ==== SEADISTUS ==== */
const APP_URL = new URL("./", location.href).href.split("#")[0].split("?")[0];
const CAPTAINS = [

      el("label", { for: "keyta", textContent: "Õiged vastused (üks rida laulu kohta: Artist – Laul | YouTube'i link)" }), ta,
      el("p", { className: "hint", textContent: "Vastuseid näed ainult sina. Mäng võrdleb kaptenite pakkumisi nendega ise (väikesed kirjavead lubatud) ja annab 0/1/2 punkti. Teleris saad iga tiimi punkte klõpsuga muuta." }),
      el("div", { style: "display:flex;gap:10px;flex-wrap:wrap" }, [
        el("button", { className: "btn", type: "button", textContent: "Salvesta", onclick: async () => {
          const list = ta.value.split("\n").map(l => l.trim()).filter(Boolean).map(l => { const [main, url] = l.split(/\s+\|\s+/); const m = main.split(/\s+[–—-]\s+/); const o = { artist: (m[0] || "").trim(), song: m.slice(1).join(" - ").trim() }; if (url && /^https?:\/\//.test(url.trim())) o.url = url.trim(); return o; });
          await write(() => keyRef.set({ list }));
          const su = shareIn.value.trim();
          await write(() => stateRef.update({ names: names.map((n, i) => n.value.trim() || DEFAULT_NAMES[i]), total: Math.max(1, Number(total.value) || DEFAULT_TOTAL), shareUrl: /^https:\/\/[^\s]+$/.test(su) ? su : "" }));
          closeSheet();
        } }),
        el("button", { className: "ghost", type: "button", textContent: "Sulge", onclick: closeSheet })
      ]),
      el("label", { textContent: "Kaptenite link" }), el("div", { hidden: true }, [shareIn]),
      el("div", { className: "qr" }, [qrbox, el("div", {}, [el("code", { textContent: link }), el("p", { className: "hint", textContent: "Suur QR ilma vastuste ja seadeteta: nupp „QR kaptenitele“ või klahv Q." })])]),
      el("label", { textContent: "Ohtlik tsoon" }), resetWrap
    ])]);
    render();
    qrInto(qrbox, 168);
    setTimeout(() => names[0].focus(), 0);
  }
  function closeSheet() { sheet = null; render(); }
  document.addEventListener("fullscreenchange", () => render());
}

/* =========================================================
   TELEFON (kapten)
   ========================================================= */
async function startPhone() {
  const uid = await user.id();
  if (!uid) { message("Laululahing", "Vastuste saatmiseks ava link Claude'i kontoga sisse logituna."); return; }
  const myRef = db.doc("subs/" + uid), stateRef = db.doc("game/state");
  let st = null, me = null, loaded = 0, draft = { artist: "", song: "" }, draftRound = 0, sending = false, err = "", lastRevealKey = "", editing = false;
  const caps = [0, 1, 2].map(i => captain(i));
  const loadTimer = setTimeout(() => { if (loaded < 2) message("Laululahing", "Mänguga ei saa ühendust. Kontrolli internetti ja oota hetk."); }, 10000);
  stateRef.onSnapshot(s => { st = s.exists ? s.data() : null; loaded |= 1; if (loaded === 3) clearTimeout(loadTimer); render(); }, e => message("Laululahing", "Mängu ei saa lugeda (" + e.code + ")."));
  myRef.onSnapshot(s => { me = s.exists ? s.data() : null; loaded |= 2; if (loaded === 3) clearTimeout(loadTimer); render(); }, () => { loaded |= 2; render(); });

  async function pick(t) {
    err = "";
    try { await myRef.set({ team: t, game: st.game, ans: {} }); }
    catch (e) { err = e && e.code === "invalid_argument" ? "Sul pole veel õigust vastuseid saata. Palu Karlil jagada see link sinuga toimetaja (Editor) õigusega." : "Ei õnnestunud salvestada (" + (e && e.code) + "). Proovi uuesti."; render(); }
  }
  async function send(r) {
    if (sending) return;
    if (!draft.artist.trim() && !draft.song.trim()) { err = "Kirjuta vähemalt artist või laul."; render(); return; }
    sending = true; err = ""; render();
    try { await myRef.update({ ans: { [r]: { artist: draft.artist.trim(), song: draft.song.trim(), at: Date.now() } } }); }
    catch (e) { err = e && e.code === "invalid_argument" ? "Sul pole õigust vastuseid saata. Palu Karlil jagada link sinuga toimetaja (Editor) õigusega." : "Saatmine ebaõnnestus (" + (e && e.code) + "). Proovi uuesti."; }
    sending = false; if (!err) editing = false; render();
  }

  function render() {
    if (loaded !== 3) return;
    if (!st) { message("Laululahing", "Ootan mängu algust… Hoia see leht lahti, mäng ilmub siia ise. / Waiting for the game to start – keep this page open."); return; }
    const myTeam = me && me.game === st.game && typeof me.team === "number" ? me.team : -1;
    const head = el("div", { className: "ph-head" }, [el("div", { className: "logo", textContent: "Laululahing" }), myTeam >= 0 ? el("div", { className: "ph-round" }, ["LAUL ", el("b", { textContent: st.round }), "/" + st.total]) : null]);
    const errBox = err ? el("div", { className: "err", role: "alert", textContent: err }) : null;

    if (myTeam < 0) {
      show(el("div", { id: "phone" }, [head, el("p", { style: "margin:0;font-size:18px", textContent: "Vali oma tiim / Pick your team:" }), errBox,
        el("div", { className: "pick" }, [0, 1, 2].map(t => el("button", { className: "pickbtn panel", type: "button", onclick: () => pick(t) }, [el("img", { src: CAPTAINS[t].img, alt: "" }), teamName(st, t)])))]));
      return;
    }
    const tot = totals(st), r = st.round, rd = st.rounds && st.rounds[r];
    const meRow = el("div", { className: "me" }, [el("img", { src: CAPTAINS[myTeam].img, alt: "" }), el("div", {}, [el("div", { className: "n", textContent: teamName(st, myTeam) }), el("div", { className: "s", textContent: tot[myTeam] + " punkti" })])]);
    const body = [head, meRow, errBox];

    if (st.phase === "revealed" && rd) {
      const p = Number(rd.pts && rd.pts[myTeam]) || 0;
      const a = rd.ans && rd.ans[myTeam];
      const res = el("div", { className: "result panel" }, [
        el("div", { className: "big p" + p, textContent: "+" + p }),
        el("div", { textContent: p === 2 ? "Täistabamus! / Spot on!" : p === 1 ? "Pooleldi õige / Half right" : "Seekord mööda / Missed this one" }),
        rd.correct && (rd.correct.artist || rd.correct.song) ? el("div", { style: "font-weight:700;font-size:18px" }, ["Õige: " + (rd.correct.artist || "?") + " – " + (rd.correct.song || "?")]) : null,
        a && !a.none ? el("div", { style: "color:var(--muted)", textContent: "Sinu vastus: " + (a.artist || "–") + " – " + (a.song || "–") }) : null,
        el("div", { style: "color:var(--muted);font-size:14px", textContent: "Oota järgmist laulu…" })
      ]);
      body.push(res);
      const rk = r + ":" + p;
      if (lastRevealKey !== rk) { lastRevealKey = rk; setTimeout(() => (p === 2 ? caps[myTeam].laugh() : p === 0 ? caps[myTeam].cry() : 0), 200); }
      body.splice(2, 0, el("div", { style: "display:flex;justify-content:center" }, [caps[myTeam]]));
    } else {
      const mine = me.ans && me.ans[r];
      if (draftRound !== r) { draftRound = r; editing = false; draft = { artist: (mine && mine.artist) || "", song: (mine && mine.song) || "" }; }
      const playing = st.playing === r;
      body.push(el("div", { className: "now panel" + (playing ? " on" : "") }, [
        el("span", { className: "eq" + (playing ? " on" : ""), "aria-hidden": "true" }, [el("i"), el("i"), el("i"), el("i")]),
        el("div", {}, [el("div", { className: "nowt", textContent: playing ? "Laul " + r + " mängib – vasta nüüd!" : "Laul " + r + " algab kohe" }),
          el("div", { className: "nows", textContent: playing ? "Song " + r + " is playing – answer now!" : "Song " + r + " starts soon. You can already type." })])
      ]));
      if (mine && !editing) {
        body.push(el("div", { className: "done panel" }, [
          el("div", { className: "ok", textContent: "Vastus saadetud ✓ / Sent ✓" }),
          el("div", { className: "mine", textContent: (mine.artist || "–") + " – " + (mine.song || "–") }),
          el("button", { className: "ghost editbtn", type: "button", textContent: "Muuda vastust / Change answer", onclick: () => { editing = true; draft = { artist: mine.artist || "", song: mine.song || "" }; render(); } }),
          el("div", { className: "hint2", textContent: "Vaata telerit – vastused avatakse korraga. / Watch the TV for the reveal." })
        ]));
      } else {
        const ai = el("input", { type: "text", id: "artist", value: draft.artist, autocomplete: "off", autocapitalize: "words", enterkeyhint: "next", oninput: e => { draft.artist = e.target.value; } });
        const si = el("input", { type: "text", id: "song", value: draft.song, autocomplete: "off", autocapitalize: "sentences", enterkeyhint: "send", oninput: e => { draft.song = e.target.value; } });
        body.push(el("form", { className: "form panel", onsubmit: e => { e.preventDefault(); send(r); } }, [
          el("label", { for: "artist", textContent: "Artist" }), ai,
          el("label", { for: "song", textContent: "Laul / Song" }), si,
          el("button", { className: "btn", type: "submit", disabled: sending, textContent: sending ? "Saadan…" : mine ? "Uuenda vastust / Update" : "Saada vastus / Send" })
        ]));
      }
    }
    body.push(el("button", { className: "linkbtn", type: "button", textContent: "Vaheta tiimi / Change team", onclick: () => { myRef.update({ team: -1 }).catch(() => {}); } }));
    const active = document.activeElement && document.activeElement.id;
    const sel = active && document.activeElement.selectionStart;
    show(el("div", { id: "phone" }, body));
    if (active) { const n = document.getElementById(active); if (n) { n.focus(); try { n.setSelectionRange(sel, sel); } catch (e) {} } }
  }
}

/* =========================================================
   KÄIVITUS
   ========================================================= */
(async () => {
  if (!window.claude || !window.claude.use) { message("Laululahing", "Ava see mäng Claude'i lingi kaudu."); return; }
  [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!db) { message("Laululahing", "Mänguga ühendamiseks logi Claude'i kontole sisse."); return; }
  const owner = user ? await user.isOwner() : false;
  const h = location.hash.replace("#", "");
  const mode = h === "kapten" ? "phone" : h === "ekraan" ? "tv" : owner ? "tv" : "phone";
  if (mode === "tv" && !owner) { message("Laululahing", "Teleriekraani saab juhtida ainult Karl. Ava link ilma lõputa #ekraan, et vastata kaptenina."); return; }
  if (mode === "tv") startTV(); else startPhone();
})();
</script>
